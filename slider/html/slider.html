<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="../css/slider.css">
    <link rel="stylesheet" href="../css/fonts.css">
</head>

<body>

    <div class="slider-items">
        <div class="other-item">
            <div class="container">
                <div class="links-item">
                </div>
            </div>
            <div class="grid-other">
                <div class="container">
                    <div class="title-info">
                        <div class="title-h3">COMPLETED PROJECTS</div>
                        <div class="rectangleDivTitle"></div>

                        <p class="info-p">Only a small part of the work performed by our company is presented on the
                            site. For
                            14
                            years on in the construction
                            market we have made happy more than 1000 families</p>
                    </div>
                    <div class="grid-items">
                        <div class="grid-item">
                            <h3 class="name">CITY:</h3>
                            <div class="country-container">
                                <div class="country"></div>
                            </div>
                        </div>
                        <div class="grid-item">
                            <h3 class="name">REPAIR TIME:</h3>
                            <div class="repair-container">
                                <div class="repair"></div>
                            </div>
                        </div>
                        <div class="grid-item">
                            <h3 class="name">APARTMENT AREA:</h3>
                            <div class="area-container">
                                <div class="area"></div>
                            </div>
                        </div>
                        <div class="grid-item">
                            <h3 class="name">REPAIR COST:</h3>
                            <div class="cost-container">
                                <div class="cost"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="img-slider">
                    <div class="images"></div>
                </div>
            </div>
            <div class="option-toggle">
                <div class="container">
                    <div class="toggle">
                        <div class="arrow left"></div>
                        <div class="dots"></div>
                        <div class="arrow right"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="../jsCode/images.js"></script>
    <script src="../jsCode/initImages.js"></script>
    
    <script src="../jsCode/titles.js"></script>
    <script src="../jsCode/initLinks.js"></script>
    <script src="../jsCode/initDots.js"></script>
    <script src="../jsCode/initArrows.js"></script>

    <script src="../jsCode/slider.js"></script>
</body>

</html>
